[package]
name = "nulkast-fw"
version = "0.1.0"
edition = "2021"
description = "Lean, modular Debian Linux home firewall, IDS/IPS, and SQM traffic shaper"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

[profile.release]
lto = true
codegen-units = 1
strip = true
