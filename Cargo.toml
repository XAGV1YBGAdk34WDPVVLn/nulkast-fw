[package]
name = "nulkast-fw"
version = "0.1.0"
edition = "2021"
description = "Lean, modular Debian Linux home firewall, IDS/IPS, and SQM traffic shaper"

[dependencies]
axum = { version = "0.7", features = ["ws", "json"] }
clap = { version = "4.5", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal", "fs"] }
toml = "0.8"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
